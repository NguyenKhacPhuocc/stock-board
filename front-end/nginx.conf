server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Proxy API requests if you want frontend to talk to backend via same domain
    # location /api/ {
    #     proxy_pass http://backend:3000;
    # }
}
